name: Outside benchmarks

# Runs tools/bench-stdlib.py: the JSON, HTTP, TLS, and SQLite numbers of
# ztcl and of the other runtimes, in one job. The TSV file is an artifact.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Also measure the numbers of the site (tools/bench-site.py)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The runner image has Go and Python.
      - name: Install the outside programs
        run: sudo apt-get update && sudo apt-get install -y wrk nghttp2-client tcl tcl-dev openssl
      # perf for the json-cpu rows. The rows are absent when perf cannot count.
      - name: Install perf
        run: |
          sudo apt-get install -y "linux-tools-$(uname -r)" linux-tools-common || true
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
      - name: Build the runner
        run: zig build
      - name: Run the benchmarks
        run: python3 -I tools/bench-stdlib.py
      - name: Check the gates
        run: python3 -I tools/bench-stdlib.py --check bench/stdlib/gates.tsv --dry-run
      # The site quotes tclsh 8.6.16 with Thread 2.8.11. The source
      # release has the Thread package in pkgs/.
      - name: Build tclsh 8.6.16
        if: inputs.site
        run: |
          curl -fsSL -o tcl.tar.gz https://prdownloads.sourceforge.net/tcl/tcl8.6.16-src.tar.gz
          tar xzf tcl.tar.gz
          cd tcl8.6.16/unix && ./configure --prefix="$HOME/tcl" >/dev/null && make -j4 >/dev/null && make install >/dev/null
      - name: Turn on perf
        if: inputs.site
        run: |
          sudo apt-get install -y "linux-tools-$(uname -r)" linux-tools-common || true
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
          perf stat -e instructions:u true || echo "perf has no hardware counter"
      - name: Measure the numbers of the site
        if: inputs.site
        run: |
          zig build -Doptimize=ReleaseFast -Dstrip=true
          nproc; lscpu | grep -E "Model name|^CPU\(s\)" || true
          python3 -I tools/bench-site.py --tclsh "$HOME/tcl/bin/tclsh8.6" --out zig-out/bench/site.md
          tools/fetch-kostya.sh && for f in --no-jit --no-jit-tier2 ""; do tools/kostya.sh $f -t "$HOME/tcl/bin/tclsh8.6" | tee -a zig-out/bench/kostya.txt; done || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: zig-out/bench/
