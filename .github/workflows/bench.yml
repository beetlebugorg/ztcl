name: Outside benchmarks

# Runs tools/bench-stdlib.py: the JSON, HTTP, TLS, and SQLite numbers of
# ztcl and of the other runtimes, in one job. The TSV file is an artifact.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The runner image has Go and Python.
      - name: Install the outside programs
        run: sudo apt-get update && sudo apt-get install -y wrk nghttp2-client tcl tcl-dev openssl
      - name: Build the runner
        run: zig build
      - name: Run the benchmarks
        run: python3 -I tools/bench-stdlib.py
      - name: Check the gates
        run: python3 -I tools/bench-stdlib.py --check bench/stdlib/gates.tsv --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: zig-out/bench/bench.tsv
