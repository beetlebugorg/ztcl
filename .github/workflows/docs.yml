name: Docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "tools/build-docs.py"
      - "tools/reference.py"
      - "tools/docs-requirements.txt"
      - "web/**"
      - "src/**"
      - "build.zig"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.0"
      # The playground loads the WebAssembly build.
      - run: zig build wasm wasm-threads wasm-shell wasm-host
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/docs-requirements.txt
      - run: python tools/build-docs.py site
      # No page shows a comment line of the Markdown as text.
      - run: sh tests/site.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
