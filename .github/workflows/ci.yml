name: CI

# Builds and tests ztcl on each push to main and each pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The full matrix (macOS, Windows) runs every 6 hours on main; pull
  # requests and pushes run the quick Linux jobs only.
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

# A new push to a pull request cancels the run of its old commit. Runs
# on main do not cancel each other: each one completes and saves the Zig
# cache. A scheduled or manual run has a group of its own, so a push to
# main does not cancel the full run while it waits.
concurrency:
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: "0.17.0"

jobs:
  # Which parts of the repository changed: a pull request that touches
  # only docs and site files skips the build and test jobs of the code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      docs: ${{ steps.f.outputs.docs }}
      wasm: ${{ steps.f.outputs.wasm }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"; echo docs=true >> "$GITHUB_OUTPUT"; echo wasm=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          printf '%s\n' "$files"
          docs_re='^(docs/|README\.md|CHANGELOG\.md|CONTRIBUTING\.md|SECURITY\.md|WRITING\.md|AGENTS\.md|tools/build-docs\.py|tools/docs-requirements\.txt|licenses/)'
          if printf '%s\n' "$files" | grep -qvE "$docs_re"; then code=true; else code=false; fi
          if printf '%s\n' "$files" | grep -qE "$docs_re"; then docs=true; else docs=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "docs=$docs" >> "$GITHUB_OUTPUT"
          # The files that the WebAssembly and WASI jobs build or run. A
          # pull request that changes none of them skips those jobs.
          wasm_re='^(src/|build\.zig|build\.zig\.zon|wit/|web/|npm/|enclave/|bench/|examples/web/|tests/(jit|mem|point|thread|web)/|tools/(wasm|point|wasi|jit-fuzz|fetch-|tcltest|suite|thread-tests|witgen)|\.github/workflows/ci\.yml)'
          if printf '%s\n' "$files" | grep -qE "$wasm_re"; then wasm=true; else wasm=false; fi
          echo "wasm=$wasm" >> "$GITHUB_OUTPUT"

  # The module map of src/ (docs/dev/architecture.md): a report of the
  # imports, the cycles, and the layering breaks. The job is a report:
  # a break does not fail it.
  modmap:
    name: Module map
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Test the tool
        run: zig test tools/modmap.zig
      - name: Write the report
        run: |
          mkdir -p modmap
          zig run tools/modmap.zig -- --dot modmap/modmap.dot --area-dot modmap/areas.dot > modmap/modmap.md
          zig run tools/modmap.zig -- --only summary,areas,cycles >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modmap
          path: modmap/

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest", "macos-15-intel", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: ${{ runner.os != 'Linux' }}
      # On Linux, only pushes to main save the Zig cache, and pull
      # requests restore the cache of main. The caches of pull requests
      # then do not push the cache of main out of the 10 GB of the
      # repository (docs/dev/ci.md).
      - name: Put the Zig cache in the workspace
        if: runner.os == 'Linux'
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux'
        with:
          path: .zig-cache
          key: zig-test-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-test-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            zig-test-${{ runner.os }}-${{ env.ZIG_VERSION }}-
      # ulimit -v is enforced on Linux only. On macOS and Windows, the
      # memory limit of the interpreter is the only cap.
      # The JIT memory of the runner, for the log: a virtual Mac has no
      # write protection for each thread, so the region takes the page
      # form there.
      - name: Probe the executable memory of the JIT
        if: runner.os == 'macOS'
        run: |
          zig build jit-probe
      # The tests of isolate_linux_tests.zig need unprivileged user
      # namespaces with mounts, which the AppArmor of Ubuntu limits, and
      # a cgroup that the user owns with the cpu, memory, and pids
      # controllers. The test steps run in that cgroup, and
      # ZTCL_TEST_ISO_LINUX makes a skip of those tests a failure.
      - name: Allow the sandbox of isolated threads
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "+cpu +memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          sudo mkdir -p /sys/fs/cgroup/ztcl-ci/leaf
          echo "+cpu +memory +pids" | sudo tee /sys/fs/cgroup/ztcl-ci/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/ztcl-ci
          echo "ZTCL_TEST_ISO_LINUX=1" >> "$GITHUB_ENV"
      - name: Build and test
        # The tests of ztcl::mac call the keychain and the defaults of the
        # runner. A development Mac leaves the variable unset, because a
        # keychain can ask the user there.
        env:
          ZTCL_TEST_MAC: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            echo $$ | sudo tee /sys/fs/cgroup/ztcl-ci/leaf/cgroup.procs
            ulimit -v 6000000
          fi
          zig build install test
      - name: Run a script
        run: |
          if [ "$RUNNER_OS" = Linux ]; then ulimit -v 6000000; fi
          test "$(zig build run -- bench/sum.tcl | tr -d '\r')" = 499999500000
          # Two writers on one output file: the output of the runner goes
          # after the line before it.
          printf 'puts hello\n' > "$RUNNER_TEMP/h.tcl"
          { echo first; zig-out/bin/ztcl "$RUNNER_TEMP/h.tcl"; echo last; } > "$RUNNER_TEMP/h.out"
          test "$(tr -d '\r' < "$RUNNER_TEMP/h.out" | tr '\n' ' ')" = "first hello last "
      - name: Run the examples of the module pages
        if: runner.os == 'Linux'
        run: |
          python3 -I tools/doc-examples.py zig-out/bin/ztcl --reference docs/modules/vt.md docs/modules/watch.md docs/learn/*.md
          python3 -I tools/ref-coverage.py zig-out/bin/ztcl
          python3 -I tools/reference.py shell-table | diff - src/shell/reference.txt
          python3 -I tools/doc-coverage.py
      - name: Check the format
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig src
      - name: Run the Wycheproof sets of the TLS primitives
        if: runner.os == 'Linux'
        run: |
          ulimit -v 6000000
          zig build tls-wycheproof -Doptimize=ReleaseSafe -- "$(tools/fetch-wycheproof.sh)"
      - name: Run the x509-limbo cases and the fuzzer of the chain checks
        if: runner.os == 'Linux'
        run: |
          ulimit -v 6000000
          zig build tls-x509-test -Doptimize=ReleaseSafe -- "$(tools/fetch-x509-limbo.sh)"
          zig build x509-fuzz -- --seconds 60
      - name: Run the TLS client against openssl s_server
        if: runner.os == 'Linux'
        run: |
          ulimit -v 6000000
          tools/tls-interop.sh --quick client
      # A gc-precise build uses the root rules of WebAssembly and has no JIT.
      - name: Test the gc-precise build
        if: runner.os == 'Linux'
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/ztcl-ci/leaf/cgroup.procs
          ulimit -v 6000000
          zig build test -Dgc-precise=true
      # The JIT is on by default. A build with no JIT code is the other
      # path.
      - name: Test the build with no JIT
        if: runner.os == 'Linux'
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/ztcl-ci/leaf/cgroup.procs
          ulimit -v 6000000
          zig build test -Djit=false
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux' && github.event_name == 'push'
        with:
          path: .zig-cache
          key: zig-test-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}

  # C packages: the build with -Dcext, its unit tests, and the test
  # packages of tests/cext, each one compared with tclsh.
  cext:
    name: C packages (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install tclsh and the Tcl headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tcl8.6 tcl8.6-dev > /dev/null
      - name: Build and test with -Dcext
        run: |
          ulimit -v 6000000
          zig build install test-cext-native -Dcext=true
      - name: Compare the test packages with tclsh
        run: TCLSH=tclsh8.6 tools/cext/check.sh zig-out/bin/ztcl
      - name: Check the coverage table
        run: python3 -I tools/cext/coverage.py --check
      - name: Build libztcl and compare embedders with libtcl8.6
        run: |
          ulimit -v 6000000
          zig build libztcl
          TCLSH=tclsh8.6 tools/libztcl/check.sh
          TCLSH=tclsh8.6 tools/libztcl/tclsh.sh
          zig build libztcl --prefix "$RUNNER_TEMP/kit"
          TCLSH=tclsh8.6 tools/libztcl/kit.sh "$RUNNER_TEMP/kit" zig-out/bin/ztcl

  # C packages in WebAssembly: the test packages of tests/cext built for
  # wasm32-wasi and run on ztcl-host.wasm in Node.js, each one compared
  # with tclsh.
  cext-wasm:
    name: C packages (WebAssembly)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install tclsh and the Tcl headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tcl8.6 tcl8.6-dev > /dev/null
      - name: Build the stub library and ztcl-host.wasm
        run: zig build cext-stubs wasm-host -Dcext-wasm=true
      - name: Compare the test packages with tclsh
        run: TCLSH=tclsh8.6 tools/cext/wasm-check.sh

  # ztcl build: each runtime of `zig build runtimes`, and a binary for
  # each target with a payload. Each runner builds and runs the binary
  # of its own target from the runtime of `zig build runtimes`. Linux
  # also builds each other target and runs the arm64 binary under qemu.
  # On arm64 macOS the kernel runs only a binary with a valid signature,
  # so the run checks the ad hoc signature of src/macho.zig.
  build-native:
    name: ztcl build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # One zig build for ztcl and the six runtimes, so that Zig compiles
      # them in parallel.
      - name: Build the runtimes
        run: |
          zig build install runtimes
          ls -l zig-out/lib/ztcl/runtime/*/
      - name: Build and run a binary
        run: |
          mkdir -p app/data
          printf 'puts "hello from [file tail [info script]] $argv"\nsource [file join [file dirname [info script]] lib.tcl]\n' > app/main.tcl
          printf 'set f [open //zipfs:/app/data/msg.txt]\nputs [gets $f]\nclose $f\n' > app/lib.tcl
          echo "a file in the payload" > app/data/msg.txt
          cd app
          ext=; if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          ../zig-out/bin/ztcl build -o hello$ext --embed lib.tcl --embed data main.tcl
          test "$(./hello$ext a b | tr -d '\r')" = "$(printf 'hello from main.tcl a b\na file in the payload')"
      - name: Build a stripped binary
        if: runner.os == 'Linux'
        run: tests/strip.sh
      - name: Build each target from Linux
        if: runner.os == 'Linux'
        run: |
          cd app
          for t in x86_64-linux aarch64-linux x86_64-macos aarch64-macos x86_64-windows aarch64-windows; do
            ../zig-out/bin/ztcl build --target $t -o hello-$t --embed lib.tcl --embed data main.tcl
          done
          file hello-*
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user > /dev/null
          test "$(qemu-aarch64 ./hello-aarch64-linux x | head -1)" = "hello from main.tcl x"
      - name: Show the signature
        if: runner.os == 'macOS'
        run: codesign -dv app/hello 2>&1 | head -8

  # The JIT on arm64 macOS: the suite with the JIT at threshold 0 and with
  # tier 2 must give the counts of each file without the JIT, and
  # tools/jit-diff.sh -t must find no difference. socket.test is left out
  # of the compare: its counts move between runs of one mode, from the
  # timing of its sockets. The counts of io.test and chanio.test move by
  # one or two in the same way (issue 73), so their pass counts must stay
  # within 2 of the run without the JIT.
  jit-macos:
    name: JIT (macos-latest)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Suite with and without the JIT
        run: |
          zig build
          zig build suite-runner
          zig build jit-probe
          # The file system of macOS ignores case, so the names of the
          # counts files differ in more than case.
          for m in none tier1 tier2; do
            case $m in none) f=-n ;; tier1) f=-j ;; tier2) f=-J ;; esac
            tools/suite.sh -a $f -o suite-$m.tsv | tail -1
          done
          loose='^(socket|io|chanio)\.test'
          for m in tier1 tier2; do
            diff <(grep -v skipped suite-none.tsv | grep -Ev "$loose" | cut -f1-4 | sort) \
                 <(grep -v skipped suite-$m.tsv | grep -Ev "$loose" | cut -f1-4 | sort)
            for t in io.test chanio.test; do
              a=$(awk -F'\t' -v t=$t '$1 == t && $2 != "skipped" {print $2}' suite-none.tsv)
              b=$(awk -F'\t' -v t=$t '$1 == t && $2 != "skipped" {print $2}' suite-$m.tsv)
              echo "$t pass: none $a, $m $b"
              [ -n "$a" ] && [ -n "$b" ] && [ $((a > b ? a - b : b - a)) -le 2 ]
            done
          done
      - name: Differential test of the JIT
        run: tools/jit-diff.sh -t
      # Each program also runs at 4 random memory limits.
      - name: Fuzzer of the JIT
        run: |
          for f in tests/jit/replay/*.tcl; do zig build jit-fuzz -- --replay "$f"; done
          zig build jit-fuzz -- --seconds 600 --mem-runs 4
          zig build jit-fuzz -- --seconds 600 --mem-runs 4 --tier2

  # The JIT on arm64 Linux, on each pull request: the unit tests, the
  # differential test, and the fuzzer for a bounded time.
  jit-arm64-linux:
    name: JIT (ubuntu-24.04-arm)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build and test
        run: |
          ulimit -v 6000000
          zig build
          zig build jit-probe
          zig build test
      - name: Differential test of the JIT
        run: |
          ulimit -v 6000000
          zig build suite-runner
          tools/jit-diff.sh
          tools/jit-diff.sh -t
      # Each program also runs at 4 random memory limits. A scheduled run
      # fuzzes for longer.
      - name: Fuzzer of the JIT
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '120' || '900' }}
        run: |
          ulimit -v 6000000
          for f in tests/jit/replay/*.tcl; do zig build jit-fuzz -- --replay "$f"; done
          zig build jit-fuzz -- --seconds "$FUZZ_SECONDS" --mem-runs 4
          zig build jit-fuzz -- --seconds "$FUZZ_SECONDS" --mem-runs 4 --tier2
      # The wall times for docs/jit.md: the best of 5 runs of each script.
      - name: Time the JIT
        run: |
          zig build -Doptimize=ReleaseFast -p rel
          for f in bench/sum.tcl bench/dsum.tcl bench/nested.tcl bench/foreach.tcl bench/fib.tcl; do
            for m in --no-jit --no-jit-tier2 ""; do
              best=
              for k in 1 2 3 4 5; do
                t0=$(date +%s%N); rel/bin/ztcl $m $f > /dev/null; t1=$(date +%s%N)
                ms=$(( (t1 - t0) / 1000000 )); if [ -z "$best" ] || [ $ms -lt $best ]; then best=$ms; fi
              done
              echo "time $f ${m:-default} $best ms"
            done
          done

  suite:
    name: Tcl 8.6.16 suite
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Run the suite
        run: |
          ulimit -v 6000000
          zig build
          tools/suite.sh -t core-8-6-16 | tee suite.txt
          awk '$1 == "total" { found = 1; ok = ($3 >= 19241) } END { exit !(found && ok) }' suite.txt
      # The runner with the JIT on (the default) and off.
      - name: Run the suite with no JIT
        run: |
          ulimit -v 6000000
          tools/suite.sh -n -t core-8-6-16 | tee suite-off.txt
          awk '$1 == "total" { found = 1; ok = ($3 >= 19241) } END { exit !(found && ok) }' suite-off.txt

  # The WebAssembly checks are three jobs that run at the same time. Each
  # job builds all of its steps with one `zig build`, so that Zig
  # compiles them in parallel.
  wasm:
    name: WebAssembly
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # enclave-core is the core of the VBS enclave of Windows
      # (docs/dev/enclave.md), with no capability like ztcl.wasm. The
      # link of the DLL needs MSVC.
      - run: zig build wasm wasm-shell wasm-host enclave-core wasm-threads
      - run: node tools/wasm-smoke.mjs zig-out/lib/ztcl.wasm
      - run: node tools/wasm-web.mjs zig-out/lib/ztcl.wasm
      - run: node tools/wasm-shell.mjs zig-out/lib/ztcl-shell.wasm
      - run: node tools/wasm-host.mjs zig-out/lib/ztcl.wasm zig-out/lib/ztcl-host.wasm
      - run: node tools/web-api.mjs zig-out/lib/ztcl.wasm zig-out/lib/ztcl-host.wasm
      # The threads in Node.js and in Chromium, with and without
      # cross-origin isolation. The browser test uses the Chrome of the
      # runner.
      - run: node tools/wasm-threads.mjs node
      - run: node tools/wasm-threads.mjs browser
        env:
          CHROME: /usr/bin/google-chrome

  wasm-aot:
    name: WebAssembly, compiled procs
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: zig build install wasm wasm-aot
      # A bundle of `ztcl build --wasm`. The native ztcl makes it.
      - run: node tools/wasm-bundle.mjs zig-out/bin/ztcl zig-out/lib/ztcl.wasm
      # Procs compiled to wasm (docs/dev/wasm-aot.md) against the interpreter
      # of the same runtime, with a compute limit sweep and with collections.
      - name: Procs compiled to wasm
        run: |
          node tools/wasm-aot.mjs --quiet --sweep 4 tests/jit/*.tcl tests/mem/*.tcl bench/*.tcl
          node tools/wasm-aot.mjs --quiet --gc-stress 7 tests/jit/*.tcl tests/mem/*.tcl
          node tools/wasm-aot-suite.mjs
          tools/wasm-aot-fuzz.sh -n 100 -k 2

  wasm-point:
    name: WebAssembly, point procs
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # tools/point-wasm-diff.sh runs `zig build` and `zig build point-rt`
      # again. Both find their files in the cache of this build.
      - run: zig build install point-rt wasm-simd
      # Point procs compiled to wasm (docs/dev/wasm-compile.md) against
      # Program.run and point.runSlow, and the random proc fuzzer.
      - name: Point procs compiled to wasm
        run: |
          tools/point-wasm-diff.sh
          zig build point-wasm-fuzz -- --count 300
          node tools/wasm-point.mjs zig-out/lib/ztcl-simd.wasm

  wasi:
    name: WASI
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    env:
      WASMTIME_VERSION: "50.0.0"
      WASMTIME_SHA256: "77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff"
      WASM_TOOLS_VERSION: "1.261.0"
      WASM_TOOLS_SHA256: "ad62b2176037e93e1348cb65d6212d128ca9f097b63d155569f25215818ff7b1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install wasmtime
        run: |
          name=wasmtime-v$WASMTIME_VERSION-x86_64-linux
          curl -sSfLO "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/$name.tar.xz"
          echo "$WASMTIME_SHA256  $name.tar.xz" | sha256sum -c -
          tar -xJf "$name.tar.xz"
          echo "$PWD/$name" >> "$GITHUB_PATH"
      - run: zig build -Dtarget=wasm32-wasi
      - run: tools/wasi-smoke.sh
      - name: Install wasm-tools
        run: |
          name=wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux
          curl -sSfLO "https://github.com/bytecodealliance/wasm-tools/releases/download/v$WASM_TOOLS_VERSION/$name.tar.gz"
          echo "$WASM_TOOLS_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz"
          echo "$PWD/$name" >> "$GITHUB_PATH"
      # The check of the async canonical ABI of WASI 0.3 (docs/dev/wasi-tasks/04-async-abi.md).
      - name: WASI 0.3 component, both lifts
        run: |
          for lift in sync callback; do
            zig build wasi-spike -Dwasi-lift=$lift --prefix zig-out/$lift
            c=zig-out/$lift/bin/wasi-spike.component.wasm
            wasm-tools validate --features component-model,cm-async $c
            wit=$(wasm-tools component wit $c)
            case $wit in *"import wasi:cli/stdout@0.3.2"*) ;; *) echo "no stdout import"; exit 1;; esac
            out=$(timeout 10 wasmtime run $c)
            case $out in "ztcl: a WASI 0.3.2 stream"*) ;; *) echo "wrong output: $out"; exit 1;; esac
          done
      # The bindings of WASI 0.3.2 (docs/dev/wasi-tasks/05-wit-bindings.md).
      # `component new` compares each core import with its WIT function.
      - name: WASI 0.3 bindings
        run: |
          wasm-tools component wit wit/ > /dev/null
          zig build witgen
          git diff --exit-code src/wasi/p3.zig
          zig build wasi-bindings
          wasm-tools validate --features component-model,cm-async zig-out/bin/wasi-bindings.component.wasm
      # The command component of WASI 0.3.2 (docs/dev/wasi-tasks/06-native.md).
      # The bundle tests of tools/wasi-component.sh run `ztcl build` of
      # the native zig-out/bin/ztcl.
      - name: WASI 0.3 command component
        run: |
          zig build
          zig build wasi-component
          wasm-tools validate --features component-model,cm-async zig-out/bin/ztcl.component.wasm
          tools/wasi-component.sh

  # The wasm engine of ztcl::wasm (docs/dev/wasm-engine.md): the spec
  # tests of WebAssembly 2.0 and the WASI programs of tests/wasm.
  wasm-engine:
    name: wasm engine
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      WASM_TOOLS_VERSION: "1.261.0"
      WASM_TOOLS_SHA256: "ad62b2176037e93e1348cb65d6212d128ca9f097b63d155569f25215818ff7b1"
      # The commit of the tag wg-2.0 of WebAssembly/spec.
      SPEC_COMMIT: "fffc6e12fa454e475455a7b58d3b5dc343980c10"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install wasm-tools
        run: |
          name=wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux
          curl -sSfLO "https://github.com/bytecodealliance/wasm-tools/releases/download/v$WASM_TOOLS_VERSION/$name.tar.gz"
          echo "$WASM_TOOLS_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz"
          echo "$PWD/$name" >> "$GITHUB_PATH"
      - name: The spec tests of WebAssembly 2.0
        run: |
          git init -q spec && cd spec
          git remote add origin https://github.com/WebAssembly/spec.git
          git fetch -q --depth 1 origin "$SPEC_COMMIT"
          git checkout -q FETCH_HEAD -- test/core
          for f in test/core/*.wast; do n=$(basename "$f" .wast); mkdir -p "json/$n"
            wasm-tools json-from-wast "$f" -o "json/$n/$n.json" --wasm-dir "json/$n" > /dev/null; done
          cd .. && zig build wasm-spec -- spec/json/*/*.json
      - name: WASI programs
        run: zig build && tests/wasm/run.sh
      - name: Install tclsh and the Tcl headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tcl8.6 tcl8.6-dev > /dev/null
      - name: C packages in WebAssembly through the engine
        run: zig build cext-stubs && TCLSH=tclsh8.6 tools/cext/engine-check.sh

  # The scheduled run: all 152 files with the suite runner, without and
  # with the JIT. tools/suite-check.py fails the job when the pass count
  # of a file drops below docs/dev/suite-counts.tsv.
  suite-full:
    name: Tcl 8.6.16 suite, all files
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Run the suite
        run: |
          zig build -Doptimize=ReleaseSafe suite-runner
          r=$PWD/zig-out/bin/ztcl-suite
          tools/fetch-tcl.sh core-8-6-16 > /dev/null
          tools/suite.sh -a -r "$r" -o files.tsv | tail -1 &
          tools/suite.sh -a -j -r "$r" -o files-jit.tsv | tail -1 &
          wait
          python3 -I tools/suite-check.py files.tsv files-jit.tsv | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-counts
          path: "*.tsv"

  # The scheduled run of the 37 core files of Tcl 9.1.0 with --tcl 9.1,
  # without and with the JIT. tools/suite-check.py fails the job when the
  # pass count of a file drops below docs/dev/suite-counts-9.tsv.
  suite-9:
    name: Tcl 9.1.0 suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Run the suite
        run: |
          ulimit -v 6000000
          zig build
          tools/fetch-tcl.sh core-9-1-0 > /dev/null
          tools/suite.sh -t core-9-1-0 -o files-9.tsv | tail -1 &
          tools/suite.sh -j -t core-9-1-0 -o files-9-jit.tsv | tail -1 &
          wait
          python3 -I tools/suite-check.py files-9.tsv files-9-jit.tsv docs/dev/suite-counts-9.tsv | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-counts-9
          path: "*.tsv"

  # A failure of the scheduled full run opens an issue, so it is fixed
  # in the next batch of work.
  report:
    name: Report a failure of the full run
    if: failure() && github.event_name == 'schedule'
    needs: [test, build-native, jit-macos, jit-arm64-linux, suite, suite-full, suite-9, wasm, wasm-aot, wasm-point, wasi]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "The full CI run failed on $(date -u +%Y-%m-%d)" \
            --body "The scheduled full run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # A pull request that changes the docs builds the site, so a broken page
  # shows before the merge. The Docs workflow deploys it from main.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build wasm wasm-threads wasm-shell wasm-host
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/docs-requirements.txt
      - run: python tools/build-docs.py site
      - run: sh tests/targets.sh
