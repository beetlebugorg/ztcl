name: CI

# Builds and tests ztcl on each push to main and each pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # ulimit -v is enforced on Linux only. On macOS and Windows, the
      # memory limit of the interpreter is the only cap.
      # The JIT memory of the runner, for the log: a virtual Mac has no
      # write protection for each thread, so the region takes the page
      # form there.
      - name: Probe the executable memory of the JIT
        if: runner.os == 'macOS'
        run: |
          zig build jit-probe
      - name: Build and test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then ulimit -v 6000000; fi
          zig build
          zig build test
      - name: Run a script
        run: |
          if [ "$RUNNER_OS" = Linux ]; then ulimit -v 6000000; fi
          test "$(zig build run -- bench/sum.tcl | tr -d '\r')" = 499999500000
      - name: Check the format
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig src
      # A gc-precise build uses the root rules of WebAssembly and has no JIT.
      - name: Test the gc-precise build
        if: runner.os == 'Linux'
        run: |
          ulimit -v 6000000
          zig build test -Dgc-precise=true

  # The JIT on arm64 macOS: the suite with the JIT at threshold 0 and with
  # tier 2 must give the counts of each file without the JIT, and
  # tools/jit-diff.sh -t must find no difference. socket.test is left out
  # of the compare: its counts move between runs of one mode, from the
  # timing of its sockets. The counts of io.test and chanio.test move by
  # one or two in the same way (issue 73), so their pass counts must stay
  # within 2 of the run without the JIT.
  jit-macos:
    name: JIT (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Suite with and without the JIT
        run: |
          zig build
          zig build suite-runner
          zig build jit-probe
          # The file system of macOS ignores case, so the names of the
          # counts files differ in more than case.
          for m in none tier1 tier2; do
            case $m in none) f= ;; tier1) f=-j ;; tier2) f=-J ;; esac
            tools/suite.sh -a $f -o suite-$m.tsv | tail -1
          done
          loose='^(socket|io|chanio)\.test'
          for m in tier1 tier2; do
            diff <(grep -v skipped suite-none.tsv | grep -Ev "$loose" | cut -f1-4 | sort) \
                 <(grep -v skipped suite-$m.tsv | grep -Ev "$loose" | cut -f1-4 | sort)
            for t in io.test chanio.test; do
              a=$(awk -F'\t' -v t=$t '$1 == t && $2 != "skipped" {print $2}' suite-none.tsv)
              b=$(awk -F'\t' -v t=$t '$1 == t && $2 != "skipped" {print $2}' suite-$m.tsv)
              echo "$t pass: none $a, $m $b"
              [ -n "$a" ] && [ -n "$b" ] && [ $((a > b ? a - b : b - a)) -le 2 ]
            done
          done
      - name: Differential test of the JIT
        run: tools/jit-diff.sh -t

  suite:
    name: Tcl 8.6.16 suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Run the suite
        run: |
          ulimit -v 6000000
          zig build
          tools/suite.sh -t core-8-6-16 | tee suite.txt
          awk '$1 == "total" { found = 1; ok = ($3 >= 19241) } END { exit !(found && ok) }' suite.txt

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: zig build wasm
      - run: node tools/wasm-smoke.mjs zig-out/lib/ztcl.wasm
      - run: node tools/wasm-web.mjs zig-out/lib/ztcl.wasm
      # A bundle of `ztcl build --wasm`. The native ztcl makes it.
      - run: zig build
      - run: node tools/wasm-bundle.mjs zig-out/bin/ztcl zig-out/lib/ztcl.wasm
      # Procs compiled to wasm (docs/dev/wasm-aot.md) against the interpreter
      # of the same runtime, with a step limit sweep and with collections.
      - name: Procs compiled to wasm
        run: |
          zig build wasm-aot
          node tools/wasm-aot.mjs --quiet --sweep 4 tests/jit/*.tcl tests/mem/*.tcl bench/*.tcl
          node tools/wasm-aot.mjs --quiet --gc-stress 7 tests/jit/*.tcl tests/mem/*.tcl
          node tools/wasm-aot-suite.mjs
      # Point procs compiled to wasm (docs/dev/wasm-compile.md) against
      # Program.run and point.runSlow, and the random proc fuzzer.
      - name: Point procs compiled to wasm
        run: |
          tools/point-wasm-diff.sh
          zig build point-wasm-fuzz -- --count 300
      # The threads in Node.js and in Chromium, with and without
      # cross-origin isolation. The browser test uses the Chrome of the
      # runner.
      - run: zig build wasm-threads
      - run: node tools/wasm-threads.mjs node
      - run: node tools/wasm-threads.mjs browser
        env:
          CHROME: /usr/bin/google-chrome

  wasi:
    name: WASI
    runs-on: ubuntu-latest
    env:
      WASMTIME_VERSION: "50.0.0"
      WASMTIME_SHA256: "77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install wasmtime
        run: |
          name=wasmtime-v$WASMTIME_VERSION-x86_64-linux
          curl -sSfLO "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/$name.tar.xz"
          echo "$WASMTIME_SHA256  $name.tar.xz" | sha256sum -c -
          tar -xJf "$name.tar.xz"
          echo "$PWD/$name" >> "$GITHUB_PATH"
      - run: zig build -Dtarget=wasm32-wasi
      - run: tools/wasi-smoke.sh
