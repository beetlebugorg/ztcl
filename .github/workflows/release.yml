name: release

# Makes a GitHub release for a version tag. See docs/dev/release.md.
#
# The files of a release (VERSION is the tag with no v):
#   ztcl-VERSION-{x86_64,aarch64}-linux-musl.tar.gz
#   ztcl-VERSION-{x86_64,aarch64}-macos.tar.gz
#   ztcl-VERSION-x86_64-windows.zip
#   ztcl-VERSION-wasm.tar.gz
#   SHA256SUMS
#
# vX.Y.Z is a release. vX.Y.Z-alpha and vX.Y.Z-beta are prereleases.
# All three forms update the Homebrew tap.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha"
      - "v[0-9]+.[0-9]+.[0-9]+-beta"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (it must exist)"
        required: true

permissions:
  contents: write

env:
  ZIG_VERSION: "0.17.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check the tag
        run: |
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$'
      - name: Test
        run: |
          ulimit -v 6000000
          zig build test
      - name: Build
        run: |
          set -eu
          v="${TAG#v}"
          mkdir -p dist pkg
          for t in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos x86_64-windows; do
            zig build -Dtarget="$t" -Doptimize=ReleaseFast --prefix "out/$t"
            name="ztcl-$v-$t"
            mkdir -p "pkg/$name"
            cp LICENSE README.md "pkg/$name/"
            cp -r licenses "pkg/$name/"
            case "$t" in
              *windows*)
                cp "out/$t/bin/ztcl.exe" "pkg/$name/"
                (cd pkg && zip -qr "../dist/$name.zip" "$name")
                ;;
              *)
                cp "out/$t/bin/ztcl" "pkg/$name/"
                tar -C pkg -czf "dist/$name.tar.gz" "$name"
                ;;
            esac
          done
          # The kit of libztcl (docs/libztcl.md): Linux on glibc and macOS.
          for t in x86_64-linux-gnu x86_64-macos aarch64-macos; do
            name="libztcl-$v-$t"
            zig build libztcl -Dtarget="$t" -Doptimize=ReleaseFast --prefix "pkg/$name"
            cp LICENSE "pkg/$name/"
            cp -r licenses "pkg/$name/"
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
          done
          zig build wasm
          node tools/wasm-smoke.mjs zig-out/lib/ztcl.wasm
          name="ztcl-$v-wasm"
          mkdir -p "pkg/$name"
          cp zig-out/lib/ztcl.wasm LICENSE "pkg/$name/"
          cp -r licenses "pkg/$name/"
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
      - name: Check the Linux binary
        run: |
          set -eu
          tar -xzf "dist/ztcl-${TAG#v}-x86_64-linux-musl.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/ztcl-${TAG#v}-x86_64-linux-musl/ztcl" bench/sum.tcl)" = 499999500000
          sh tools/libztcl/kit.sh "pkg/libztcl-${TAG#v}-x86_64-linux-gnu"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  publish:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS) | tee -a "$GITHUB_STEP_SUMMARY"
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "ztcl $TAG" --generate-notes $pre
          fi

  # Without the token, the release stays and the tap keeps its version.
  homebrew:
    name: Homebrew tap
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: the tap is not updated"
            exit 0
          fi
          v="${TAG#v}"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/$OWNER/homebrew-tap" "$RUNNER_TEMP/tap"
          sh packaging/homebrew/tap.sh "$v" dist "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ztcl.rb
          git diff --cached --quiet || git commit -m "ztcl $v"
          git push
