name: Size

# Reports the size of each built-in module against its goal
# (tools/size-report.sh and tools/size-budget.tsv). The sizes are goals:
# a row over its goal gives a warning and does not fail. The job runs on
# main and on demand, not on pull requests, so it does not slow them.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The full matrix (macOS, Windows) runs every 6 hours on main; pull
  # requests and pushes run the quick Linux jobs only.
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"

jobs:
  size:
    name: Size (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Size report and check
        run: tools/size-report.sh --check
      - name: The check fails with a planted module of 7 MB
        if: runner.os == 'Linux'
        run: |
          if tools/size-report.sh --check --no-wasm --plant 7000000 --out zig-out/size-plant; then
            echo "the check passed with a planted module of 7 MB" >&2
            exit 1
          fi
