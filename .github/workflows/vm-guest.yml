name: VM guest

# Builds the kernel and BusyBox of the spike guest of ztcl::vm (ztcl#203)
# on an arm64 runner and an x86-64 runner (tools/vm-guest/build.sh), and
# keeps them as the artifacts vm-guest (arm64, for macOS) and
# vm-guest-x86_64 (for KVM). On x86-64 it then runs the boot test of
# the KVM monitor (tools/vm-guest/test-kvm.sh), when the runner has
# /dev/kvm. The proper guest image comes from the
# build of dockyard#13.
on:
  push:
    paths:
      - "tools/vm-guest/build.sh"
      - "tools/vm-guest/kernel.fragment"
      - "tools/vm-guest/kernel-x86_64.fragment"
      - "tools/vm-guest/agent.zig"
      - "tools/vm-guest/pack.sh"
      - "tools/vm-guest/test-kvm.*"
      - "src/kvm.zig"
      - "src/vm/**"
      - "src/microvm.zig"
      - ".github/workflows/vm-guest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            name: vm-guest
          - runner: ubuntu-24.04
            name: vm-guest-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sudo apt-get update && sudo apt-get install -y build-essential flex bison bc libelf-dev libssl-dev cpio
      - run: tools/vm-guest/build.sh
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.0"
      # The initramfs with the agent and BusyBox, for each architecture.
      - run: TARGET=$(uname -m)-linux-musl tools/vm-guest/pack.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: tools/vm-guest/out/
      # The boot test on KVM. GitHub gives /dev/kvm to the jobs of the
      # x86-64 Linux runners; the udev rule opens it to the runner user.
      - if: matrix.name == 'vm-guest-x86_64'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            sudo modprobe vhost_vsock && sudo chmod 666 /dev/vhost-vsock
          fi
          ls -l /dev/kvm /dev/vhost-vsock || true
      - if: matrix.name == 'vm-guest-x86_64'
        run: |
          zig build -j4
          tools/vm-guest/test-kvm.sh tools/vm-guest/out
          KERNEL=vmlinux tools/vm-guest/test-kvm.sh tools/vm-guest/out
