name: VM guest

# Builds the guest of ztcl::vm (ztcl#203, ztcl#312) on an arm64 runner
# and an x86-64 runner: the kernel and BusyBox (tools/vm-guest/build.sh),
# the initramfs with the agent (pack.sh), and the read-only root disk with
# dm-verity and the entry of the manifest (image.sh), as the artifacts
# vm-guest (arm64) and vm-guest-x86_64. On x86-64 it then runs the boot
# test of the KVM monitor (tools/vm-guest/test-kvm.sh), when the runner
# has /dev/kvm. Then the manifest of both, signed:
# - on each run, with the test key, under the name ztcl-guest-test
#   (artifact vm-image-test);
# - when vm-image-release.yml calls it (a tag vm-image-v*, or a run by
#   hand from main), also with the current release key in the
#   environment vm-release (artifact vm-image).
# Each manifest is checked with the verifier of ztcl before the upload.
# docs/dev/vm-image.md has the format, the keys, and the rotation.
on:
  # A push to main that changes the guest keeps a fresh test release on
  # main: tools/vm-guest/fetch-test-image.sh downloads it.
  push:
    branches: [main]
    paths:
      - "tools/vm-guest/build.sh"
      - "tools/vm-guest/kernel.fragment"
      - "tools/vm-guest/kernel-x86_64.fragment"
      - "tools/vm-guest/agent.zig"
      - "tools/vm-guest/pack.sh"
      - "tools/vm-guest/test-kvm.*"
      - "src/kvm.zig"
      - "src/vm/**"
      - "src/microvm.zig"
      - "src/vmimage.zig"
      - "tools/vm-guest/image.sh"
      - "tools/vm-guest/manifest.sh"
      - ".github/workflows/vm-guest.yml"
  pull_request:
    paths:
      - "tools/vm-guest/build.sh"
      - "tools/vm-guest/kernel.fragment"
      - "tools/vm-guest/kernel-x86_64.fragment"
      - "tools/vm-guest/agent.zig"
      - "tools/vm-guest/pack.sh"
      - "tools/vm-guest/test-kvm.*"
      - "tools/vm-guest/test-kvm-image.*"
      - "src/kvm.zig"
      - "src/vm/**"
      - "src/microvm.zig"
      - "src/vmimage.zig"
      - "tools/vm-guest/image.sh"
      - "tools/vm-guest/manifest.sh"
      - ".github/workflows/vm-guest.yml"
  # The release: vm-image-release.yml calls this workflow on a tag
  # vm-image-v* or a run by hand from main.
  workflow_call:

permissions:
  contents: read

jobs:
  guest:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            name: vm-guest
          - runner: ubuntu-24.04
            name: vm-guest-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sudo apt-get update && sudo apt-get install -y build-essential flex bison bc libelf-dev libssl-dev cpio squashfs-tools cryptsetup-bin
      - run: tools/vm-guest/build.sh
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.0"
      # The initramfs with the agent and BusyBox, for each architecture.
      - run: TARGET=$(uname -m)-linux-musl tools/vm-guest/pack.sh
      # The kernel of the image: Linux 7.3.6 of beetlebugorg/ztcl-guest-kernel,
      # its run 46040938500 of main (c303719, with the generation ID device), in the place of the kernel of build.sh.
      # The artifact is checked by its SHA-256 and by its SHA256SUMS, and
      # expires on 2027-02-25; a release keeps its own copy of the kernel.
      - name: Take the kernel of ztcl-guest-kernel
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.name == 'vm-guest' && '15220376578' || '15220665875' }}
          ZIP_SHA: ${{ matrix.name == 'vm-guest' && 'f4a03a312e313efbf6609d5147c982878e351f77e24754069130abe8e27fb984' || '11c18c8c7025c5ecfcfc2d2261a37e186bda43c4445622b3858143881bab4285' }}
        run: |
          set -eu
          d="$RUNNER_TEMP/rk"
          mkdir -p "$d"
          gh api "repos/beetlebugorg/ztcl-guest-kernel/actions/artifacts/$ARTIFACT/zip" > "$d/k.zip"
          echo "$ZIP_SHA  $d/k.zip" | sha256sum -c
          (cd "$d" && unzip -q k.zip && sha256sum -c SHA256SUMS)
          for f in Image bzImage vmlinux; do
            if [ -e "$d/$f" ]; then cp "$d/$f" "tools/vm-guest/out/$f"; fi
          done
          sed -n 's|^# Linux/[^ ]* \([^ ]*\) Kernel Configuration$|\1|p' "$d/kernel.config" > tools/vm-guest/out/kernel-version
          echo "kernel $(cat tools/vm-guest/out/kernel-version)"
      # The read-only root disk with dm-verity, and the entry of the
      # manifest. It prints the SHA-256 of the kernel and of the disk, and
      # the root hash, so anyone can compare them with a build of their own.
      - run: ARCH=$(uname -m | sed s/aarch64/arm64/) tools/vm-guest/image.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: tools/vm-guest/out/
      # The boot test on KVM. GitHub gives /dev/kvm to the jobs of the
      # x86-64 Linux runners; the udev rule opens it to the runner user.
      # The arm64 job runs this step too, so its log shows whether that
      # runner has /dev/kvm, for a KVM monitor on arm64 later.
      - run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            sudo modprobe vhost_vsock && sudo chmod 666 /dev/vhost-vsock
          fi
          ls -l /dev/kvm /dev/vhost-vsock || true
      - if: matrix.name == 'vm-guest-x86_64'
        run: |
          zig build -j4
          tools/vm-guest/test-kvm.sh tools/vm-guest/out
          KERNEL=vmlinux tools/vm-guest/test-kvm.sh tools/vm-guest/out
      # The boot test with the kernel of beetlebugorg/ztcl-guest-kernel:
      # the artifact guest-kernel-x86_64 of its workflow Build, run
      # 46040938500 (c303719: virtio-net, the boot page reports, and the generation ID device), checked
      # by the SHA-256 of the artifact and by its SHA256SUMS. The artifact
      # expires on 2027-02-25.
      - if: matrix.name == 'vm-guest-x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gk"
          if ! gh api repos/beetlebugorg/ztcl-guest-kernel/actions/artifacts/15220665875/zip > "$RUNNER_TEMP/gk/k.zip"; then
            echo "::warning::no download of the guest kernel artifact; the test with it is skipped"
            exit 0
          fi
          echo "11c18c8c7025c5ecfcfc2d2261a37e186bda43c4445622b3858143881bab4285  $RUNNER_TEMP/gk/k.zip" | sha256sum -c
          (cd "$RUNNER_TEMP/gk" && unzip -q k.zip && sha256sum -c SHA256SUMS)
          cp "$RUNNER_TEMP/gk/bzImage" tools/vm-guest/out/gk-bzImage
          cp "$RUNNER_TEMP/gk/vmlinux" tools/vm-guest/out/gk-vmlinux
          KERNEL=gk-bzImage tools/vm-guest/test-kvm.sh tools/vm-guest/out
          KERNEL=gk-vmlinux tools/vm-guest/test-kvm.sh tools/vm-guest/out

  # The manifest with the test key, for each run.
  manifest-test:
    needs: guest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: in
      - name: Lay out the release
        run: |
          mkdir -p rel
          cp in/vm-guest/Image rel/arm64-Image
          cp in/vm-guest/root.img rel/arm64-root.img
          cp in/vm-guest-x86_64/bzImage rel/x86_64-bzImage
          cp in/vm-guest-x86_64/root.img rel/x86_64-root.img
          tools/vm-guest/manifest.sh ztcl-guest-test "0.0.0-${GITHUB_SHA::12}" "${GITHUB_RUN_NUMBER}" 0.1.0 \
            in/vm-guest/arm64.json in/vm-guest-x86_64/x86_64.json > rel/manifest.json
      - name: Sign with the test key
        run: |
          key=$(mktemp)
          cp tools/vm-guest/testkey/test_ed25519 "$key"
          chmod 600 "$key"
          ssh-keygen -q -Y sign -f "$key" -n ztcl-vm-image rel/manifest.json
          rm -f "$key"
      - name: Check with the verifier of ztcl
        run: zig build vm-image-verify -Dvm-test-key -- "$PWD/rel"
      # The boot of the test release on KVM with create -image: the root
      # disk through dm-verity, and a changed root disk.
      - name: Boot the release on KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            sudo modprobe vhost_vsock && sudo chmod 666 /dev/vhost-vsock
          fi
          zig build -j4 -Dvm-test-key
          tools/vm-guest/test-kvm-image.sh rel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-image-test
          path: rel/

  # The manifest with the current release key: a tag vm-image-v*, or a
  # run by hand from main. The owner approves the first such run.
  manifest-release:
    needs: guest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vm-image-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: vm-release
    # A sign takes seconds: a step that waits for a passphrase fails here.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: in
      - name: Lay out the release
        run: |
          mkdir -p rel
          cp in/vm-guest/Image rel/arm64-Image
          cp in/vm-guest/root.img rel/arm64-root.img
          cp in/vm-guest-x86_64/bzImage rel/x86_64-bzImage
          cp in/vm-guest-x86_64/root.img rel/x86_64-root.img
          version=${GITHUB_REF_NAME#vm-image-v}
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-${GITHUB_SHA::12}"
          tools/vm-guest/manifest.sh ztcl-guest "$version" "${GITHUB_RUN_NUMBER}" 0.1.0 \
            in/vm-guest/arm64.json in/vm-guest-x86_64/x86_64.json > rel/manifest.json
      # The key keeps its passphrase. ssh-add reads the passphrase from an
      # askpass script that prints the environment variable, with no
      # terminal; ssh-keygen then signs through the agent with the public
      # key. No step prints either secret, and the files go at the end.
      - name: Sign with the current release key
        env:
          VM_IMAGE_SIGNING_KEY: ${{ secrets.VM_IMAGE_SIGNING_KEY }}
          VM_IMAGE_SIGNING_PASSPHRASE: ${{ secrets.VM_IMAGE_SIGNING_PASSPHRASE }}
        run: |
          set -eu
          umask 077
          work=$(mktemp -d)
          trap 'ssh-agent -k >/dev/null 2>&1 || true; shred -u "$work"/key 2>/dev/null || true; rm -rf "$work"' EXIT
          printf '%s\n' "$VM_IMAGE_SIGNING_KEY" > "$work/key"
          # The askpass script gives the passphrase once. ssh-add asks again
          # after a wrong passphrase, so a second call fails, and ssh-add
          # ends with an error in the place of a loop until the timeout.
          printf '#!/bin/sh\n[ -e "%s/asked" ] && exit 1\n: > "%s/asked"\nprintf "%%s\\n" "$VM_IMAGE_SIGNING_PASSPHRASE"\n' "$work" "$work" > "$work/askpass"
          chmod 700 "$work/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          if ! SSH_ASKPASS="$work/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=none timeout 60 setsid -w ssh-add -q "$work/key" < /dev/null; then
            echo "::error::ssh-add did not load the release key: the passphrase in VM_IMAGE_SIGNING_PASSPHRASE does not open VM_IMAGE_SIGNING_KEY, or the key is not an OpenSSH private key"
            exit 1
          fi
          # The agent must hold the key of tools/vm-guest/keys/current.pub.
          if ! ssh-add -L | grep -qF "$(cut -d' ' -f1-2 tools/vm-guest/keys/current.pub)"; then
            echo "::error::the key in VM_IMAGE_SIGNING_KEY is not the current release key ($(ssh-keygen -lf tools/vm-guest/keys/current.pub | cut -d' ' -f2))"
            exit 1
          fi
          shred -u "$work/key"
          ssh-keygen -q -Y sign -f tools/vm-guest/keys/current.pub -n ztcl-vm-image rel/manifest.json
      - name: Check with the verifier of ztcl
        run: zig build vm-image-verify -- "$PWD/rel"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-image
          path: rel/
