name: VM guest

# Builds the kernel and BusyBox of the spike guest of ztcl::vm (ztcl#203)
# on an arm64 runner and an x86-64 runner (tools/vm-guest/build.sh), and
# keeps them as the artifacts vm-guest (arm64, for macOS) and
# vm-guest-x86_64 (for KVM). The proper guest image comes from the
# build of dockyard#13.
on:
  push:
    paths:
      - "tools/vm-guest/build.sh"
      - "tools/vm-guest/kernel.fragment"
      - "tools/vm-guest/kernel-x86_64.fragment"
      - ".github/workflows/vm-guest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            name: vm-guest
          - runner: ubuntu-24.04
            name: vm-guest-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sudo apt-get update && sudo apt-get install -y build-essential flex bison bc libelf-dev libssl-dev cpio
      - run: tools/vm-guest/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: tools/vm-guest/out/
